<!DOCTYPE html>
<html>
   <head>
      <title>Avião 3D</title>

      <link rel="shortcut icon" href="../favicon.ico">
      <link rel="stylesheet" href="../html/resources/default.css">
      <meta name="viewport" content="width=device-width, initial-scale=1">  
   </head>

   <body style="cursor: none; margin:0; overflow:hidden;">
      <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
      <script type="importmap"> 
         {"imports": {"three": "../build/three.module.js"}} 
      </script>  

      <div id="container"></div>
      <div id="webgl-output">     
         <script type="module" src="jogo.js"></script>
      </div>

      <div id="controls-container" style="position: fixed; top: 20px; right: 20px; z-index: 100; background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px; font-family: Arial, sans-serif; color: white;">
         <div style="margin-bottom: 15px;">
            <label for="fogSlider" style="display: block; margin-bottom: 8px; font-weight: bold;">Fog Distance: <span id="fogValue">500</span></label>
            <input type="range" id="fogSlider" min="150" max="500" value="500" style="width: 200px; cursor: pointer;">
         </div>
      </div>

      <!-- Botões de velocidade -->
      <div id="speedControls" style="
         position: fixed;
         bottom: 20px;
         left: 50%;
         transform: translateX(-50%);
         z-index: 999;
         display: flex;
         gap: 10px;
         font-family: Arial;
      ">
         <button class="speedButton" data-speed="1" style="
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid white;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
         ">1</button>
         <button class="speedButton" data-speed="2" style="
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid white;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
         ">2</button>
         <button class="speedButton" data-speed="3" style="
            width: 50px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid white;
            background: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
         ">3</button>
      </div>

      <style>
         .speedButton.active {
            background: #ffe600 !important;
            color: black !important;
            border-color: #ffe600 !important;
         }
      </style>
      <!-- Barra de vida gráfica -->
      <div id="healthBarContainer" style="
         position: fixed;
         top: 20px;
         left: 90px;
         z-index: 999;
         font-family: Arial;
         color: white;
      ">
         <div style="
            width: 280px;
            height: 26px;
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            border-radius: 6px;
            overflow: hidden;
         ">
            <div id="healthBarFill" style="
               height: 100%;
               width: 100%;
               background: #33cc55;
               transition: width 0.2s ease, background 0.2s ease;
            "></div>
         </div>
         <div id="healthBarText" style="
            margin-top: 6px;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
         ">Energia: 100% (0/20 tiros)</div>
      </div>

      <!-- Indicador de modo invencível -->
      <div id="invincibilityIndicator" style="
         display: none;
         position: fixed;
         top: 90px;
         left: 20px;
         z-index: 999;
         color: #ffe600;
         font-size: 18px;
         font-family: Arial;
         font-weight: bold;
         background: rgba(0,0,0,0.7);
         padding: 8px 12px;
         border-radius: 6px;
         border: 2px solid #ffe600;
         animation: pulseInvincible 1s infinite;
      ">🛡️ MODO INVENCÍVEL ATIVADO (G)</div>

      <style>
         @keyframes pulseInvincible {
            0%   { opacity: 1; }
            50%  { opacity: 0.4; }
            100% { opacity: 1; }
         }
      </style>

      <!-- Tela de Game Over -->
      <div id="gameOverOverlay" style="
         display: none;
         position: fixed;
         top: 0; left: 0; width: 100%; height: 100%;
         background: rgba(0,0,0,0.85);
         z-index: 2000;
         align-items: center;
         justify-content: center;
         flex-direction: column;
         font-family: Arial;
         color: white;
         cursor: default;
      ">
         <h1 style="font-size: 48px; margin-bottom: 10px;">FIM DE JOGO</h1>
         <p style="font-size: 18px; margin-bottom: 30px;">Seu avião foi abatido.</p>
         <button id="restartButton" style="
            padding: 14px 32px;
            font-size: 20px;
            cursor: pointer;
            background: #33cc55;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
         ">REINICIAR</button>
      </div>

      <!-- Tela de carregamento -->
      <div id="loadingScreen" style="
         position: fixed;
         top: 0; left: 0; width: 100%; height: 100%;
         background: linear-gradient(to bottom, #87ceeb 0%, #6fae7c 60%, #345c34 100%);
         z-index: 3000;
         display: flex;
         align-items: center;
         justify-content: center;
         flex-direction: column;
         font-family: Arial;
         color: white;
         cursor: default;
      ">
         <h1 style="font-size: 52px; margin-bottom: 6px; text-shadow: 2px 2px 6px rgba(0,0,0,0.5);">AVIÃO 3D</h1>
         <p style="font-size: 16px; margin-bottom: 40px; opacity: 0.85;">Sobrevoe o terreno e derrube os inimigos</p>

         <div style="width: 320px; height: 22px; background: rgba(0,0,0,0.4); border: 2px solid white; border-radius: 6px; overflow: hidden;">
            <div id="loadingBarFill" style="height: 100%; width: 0%; background: #ffe600; transition: width 0.15s ease;"></div>
         </div>
         <div id="loadingPercentText" style="margin-top: 10px; font-size: 16px;">Carregando assets... 0%</div>

         <button id="startButton" disabled style="
            margin-top: 30px;
            padding: 14px 40px;
            font-size: 22px;
            cursor: not-allowed;
            background: #888;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            opacity: 0.6;
         ">START</button>
      </div>

   </body>
</html>
